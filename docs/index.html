<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Air Harp — play chords with your hands</title>
<meta name="description" content="A musical instrument you play with hand shapes in front of your webcam. The fingers you raise are the chord.">
<meta name="theme-color" content="#0d0c11">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🖐️</text></svg>">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #0d0c11; color: #e8e6ef;
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { max-width: 100%; max-height: 100%; display: block; }
  video { display: none; }

  .panel {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: radial-gradient(1200px 700px at 50% 35%, #16141d 0%, #0a090d 70%);
    padding: 24px; overflow-y: auto; z-index: 10;
  }
  .card { max-width: 560px; width: 100%; }
  h1 { font-size: clamp(28px, 6vw, 42px); margin: 0 0 6px; letter-spacing: -0.02em; }
  .sub { color: #a8a4b8; margin: 0 0 26px; font-size: 16px; }
  table { width: 100%; border-collapse: collapse; margin: 0 0 26px; font-size: 14px; }
  td { padding: 7px 0; border-bottom: 1px solid #221f2b; vertical-align: middle; }
  td:last-child { text-align: right; color: #a8a4b8; }
  .dots { display: inline-flex; gap: 5px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #33303f; }
  .dot.on { background: #f0c46a; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 10px;
    background: #f0c46a; color: #1a1509; padding: 13px 26px; font-size: 16px;
  }
  button:hover { background: #f6d288; }
  button:disabled { background: #3a3646; color: #8b8799; cursor: default; }
  .note { color: #7e7a8e; font-size: 13px; margin-top: 18px; }
  .note a { color: #a8a4b8; }
  #err { color: #ff9a8b; margin-top: 16px; font-size: 14px; display: none; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<video id="v" playsinline muted></video>

<div class="panel" id="intro">
  <div class="card">
    <h1>Air Harp</h1>
    <p class="sub">Hold up a hand. The fingers you raise are the chord.</p>
    <table id="guide"></table>
    <button id="start">Start — allow camera</button>
    <div id="err"></div>
    <p class="note">
      Everything runs in this tab. The camera never leaves your machine — there is
      no server, no upload and no recording.
      <br><a href="https://github.com/DanishTadvi0/air-harp">Source on GitHub</a>
    </p>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
